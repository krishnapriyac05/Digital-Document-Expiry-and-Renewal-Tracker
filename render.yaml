services:
  - type: web
    name: document-expiry-tracker
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import app; app.initialize()" && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: document-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/documents.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
